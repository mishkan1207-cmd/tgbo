name: TEMP Diagnose OrcaRouter key

# Временный диагностический workflow. Печатает, какие модели разрешены ключу
# ORCA_API_KEY. Ничего не публикует. Удаляется после диагностики.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Диагностика ключа OrcaRouter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Показать, что разрешено ключу
        env:
          ORCA_API_KEY: ${{ secrets.ORCA_API_KEY }}
        run: python check_key.py orca
